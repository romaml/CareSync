<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History - CareSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#0ea5e9',
                            700: '#0284c7',
                            800: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            overflow-x: hidden;
        }
        @media (max-width: 640px) {
            input, textarea, select {
                font-size: 16px !important;
            }
        }
        button, a {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="flex items-center text-primary-600 hover:text-primary-700 font-medium">
                        <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        Back
                    </a>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-primary-600 to-purple-600 bg-clip-text text-transparent">
                        CareSync
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="username" class="text-sm text-gray-700 font-medium hidden sm:inline"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:py-8 px-4 sm:px-6 lg:px-8">
        <div class="mb-6 sm:mb-8">
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Activity History</h2>
            <p class="text-gray-600 text-sm sm:text-base">View all user activities and system events</p>
        </div>

        <div id="historyContainer">
            <div class="flex items-center justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
            </div>
        </div>
    </main>

    <!-- Загрузка конфигурации перед основными скриптами -->
    <script src="config.js"></script>
    <script type="module">
        import { authHelper, toast, formatDate } from './js/auth.js';
        import { auth } from './js/api.js';
        
        function getActionColor(action) {
            if (action.includes('created')) return 'bg-green-100 text-green-800';
            if (action.includes('updated')) return 'bg-blue-100 text-blue-800';
            if (action.includes('deleted')) return 'bg-red-100 text-red-800';
            if (action.includes('login')) return 'bg-purple-100 text-purple-800';
            return 'bg-gray-100 text-gray-800';
        }
        
        async function init() {
            if (!await authHelper.requireAuth()) return;
            
            const user = await authHelper.getCurrentUser();
            if (user) {
                document.getElementById('username').textContent = user.username;
            }
            
            await loadHistory();
        }
        
        async function loadHistory() {
            try {
                const data = await auth.getActivityLogs();
                const logs = data.results || data;
                renderHistory(Array.isArray(logs) ? logs : []);
            } catch (error) {
                toast.error(error.detail || error.message || 'Failed to load activity history');
                document.getElementById('historyContainer').innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8 sm:p-12 text-center">
                        <svg class="mx-auto h-12 w-12 sm:h-16 sm:w-16 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="text-gray-500 text-base sm:text-lg">No activity history found</p>
                    </div>
                `;
            }
        }
        
        function renderHistory(logs) {
            const container = document.getElementById('historyContainer');
            
            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8 sm:p-12 text-center">
                        <svg class="mx-auto h-12 w-12 sm:h-16 sm:w-16 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="text-gray-500 text-base sm:text-lg">No activity history found</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gradient-to-r from-primary-50 to-purple-50">
                                <tr>
                                    <th class="px-4 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">User</th>
                                    <th class="px-4 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Action</th>
                                    <th class="px-4 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider hidden sm:table-cell">Resource</th>
                                    <th class="px-4 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider hidden md:table-cell">IP Address</th>
                                    <th class="px-4 sm:px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Date</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${logs.map(log => `
                                    <tr class="hover:bg-gray-50 transition-colors">
                                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
                                            <div class="text-sm font-medium text-gray-900">${log.user?.username || 'N/A'}</div>
                                        </td>
                                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
                                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${getActionColor(log.action)}">
                                                ${log.action.replace('_', ' ')}
                                            </span>
                                        </td>
                                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-500 hidden sm:table-cell">
                                            ${log.resource_type ? `
                                                <span>
                                                    ${log.resource_type}
                                                    ${log.resource_id ? ` #${log.resource_id}` : ''}
                                                </span>
                                            ` : 'N/A'}
                                        </td>
                                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-500 hidden md:table-cell">
                                            ${log.ip_address || 'N/A'}
                                        </td>
                                        <td class="px-4 sm:px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            ${log.created_at ? formatDate(log.created_at) : 'N/A'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        init();
    </script>
</body>
</html>
